name: Release frontend package

on:
  push:
    tags:
      - 'frontend-v*'

permissions:
  contents: read

concurrency:
  group: frontend-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      dist-tag: ${{ steps.release.outputs.dist-tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Validate release tag
        id: release
        run: node packages/streaming/tools/release.mjs >> "$GITHUB_OUTPUT"
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, redis, sodium, mongodb, bcmath
          coverage: none
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - run: npm run pack:streaming
      - name: Test the archive against the PHP backend
        run: npm run test:packed
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: streaming-package
          path: artifacts/streaming.tgz
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: frontend-release-traces
          path: tests/Integration/Frontend/test-results
          retention-days: 7

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: streaming-package
          path: artifacts
      - name: Publish the tested archive through npm Trusted Publishing
        env:
          NPM_DIST_TAG: ${{ needs.verify.outputs.dist-tag }}
        run: npm publish ./artifacts/streaming.tgz --access public --tag "$NPM_DIST_TAG" --ignore-scripts
